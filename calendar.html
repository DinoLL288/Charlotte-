<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar</title>
  <script>
    if (!localStorage.getItem('charlotte-user')) {
      window.location.href = 'login.html';
    }
  </script>
  <style>
    :root { --sky: #a4deff; --deep-blue: #245b85; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", Arial, sans-serif;
      background: linear-gradient(145deg, #c8edff, var(--sky) 55%, #8ccfff);
      color: var(--deep-blue);
    }
    .screen {
      width: min(1100px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 80px 18px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    h1 { margin: 0; color: #fff; font-size: clamp(2rem, 6vw, 3.6rem); text-shadow: 0 3px 14px #428ec080; }
    .subtitle { margin: 0; color: #fff; font-size: clamp(1rem, 3vw, 1.2rem); text-shadow: 0 2px 8px #428ec080; }
    .top-bar { position: fixed; top: 16px; left: 16px; z-index: 5; }
    .button {
      border: 0;
      border-radius: 999px;
      padding: 12px 22px;
      background: white;
      color: #2873a6;
      font-size: 0.98rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 7px 20px #347eac35;
      cursor: pointer;
    }
    .calendar-header {
      display: flex;
      align-items: center;
      gap: 16px;
      color: #fff;
      text-shadow: 0 2px 8px #428ec080;
    }
    .calendar-header h2 { margin: 0; font-size: clamp(1.4rem, 4vw, 2rem); }
    .calendar-header .button { padding: 10px 16px; }
    .now-line {
      margin: -8px 0 0;
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      text-shadow: 0 2px 8px #428ec080;
    }
    .now-line span { opacity: 0.85; font-weight: 600; }
    .calendar-grid {
      width: min(980px, 94vw);
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
    }
    .weekday {
      text-align: center;
      color: #fff;
      font-weight: 700;
      text-shadow: 0 1px 6px #428ec080;
      padding: 6px 0;
    }
    .day {
      background: #ffffffee;
      border-radius: 14px;
      box-shadow: 0 10px 24px #347eac25;
      min-height: 110px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
      transition: box-shadow 0.15s ease, background 0.15s ease;
    }
    .day:hover { box-shadow: 0 12px 28px #347eac40; }
    .day.muted { opacity: 0.5; }
    .day.today {
      background: #ffffff;
      box-shadow: 0 0 0 3px #4aa8e0, 0 14px 34px #347eac55;
    }
    .day.today .day-number { color: #1f6fa8; }
    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .day-number { font-weight: 700; color: #2873a6; }
    .today-tag {
      font-size: 0.66rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: #fff;
      background: #4aa8e0;
      border-radius: 999px;
      padding: 2px 8px;
      text-transform: uppercase;
    }
    .add-btn {
      border: 0;
      background: transparent;
      color: #3b7db3;
      font-weight: 700;
      cursor: pointer;
    }
    .event {
      background: #e8f6ff;
      border-radius: 10px;
      padding: 6px 8px;
      font-size: 0.9rem;
      text-align: left;
      overflow-wrap: anywhere;
      cursor: pointer;
      transition: background 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .event:hover { background: #d8efff; }
    .event-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 6px;
    }
    .event-top strong { line-height: 1.2; }
    .event-clock {
      flex: none;
      font-size: 0.78rem;
      font-weight: 700;
      color: #2873a6;
      background: #ffffffb0;
      border-radius: 999px;
      padding: 1px 7px;
    }
    .event-details { font-size: 0.8rem; color: #3b7db3; }
    .event-by { font-size: 0.75rem; color: #7fa9c6; }
    .event-badge {
      align-self: flex-start;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      border-radius: 999px;
      padding: 2px 8px;
    }
    .event.now { background: #dff7e6; box-shadow: 0 0 0 2px #57c98a inset; }
    .event.now .event-clock { color: #1f7a4d; background: #ffffffc0; }
    .event.now .event-badge { background: #35a86b; color: #fff; }
    .event.soon .event-badge { background: #dff0ff; color: #2873a6; }
    .event.done { opacity: 0.6; }
    .event.done .event-badge { background: #eef2f5; color: #7d8a94; }
    .modal {
      position: fixed;
      inset: 0;
      background: #245b8526;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal.active { display: flex; }
    .modal-card {
      width: min(420px, 92vw);
      background: #ffffffee;
      border-radius: 16px;
      box-shadow: 0 18px 40px #347eac40;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal-card input, .modal-card textarea {
      width: 100%;
      border-radius: 10px;
      border: 1px solid #b9dcf5;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 0.98rem;
    }
    .modal-date {
      margin-top: -8px;
      font-size: 0.85rem;
      color: #3b7db3;
      font-weight: 700;
    }
    .title-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .title-row #eventTitle { flex: 1 1 180px; width: auto; }
    .title-row #eventStart { flex: 0 0 auto; width: 150px; }
    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      align-items: center;
    }
    .button.danger {
      background: #ffe9e9;
      color: #b53b3b;
      margin-right: auto;
    }
    .modal-hint {
      display: none;
      font-size: 0.85rem;
      color: #3b7db3;
      background: #e8f6ff;
      border-radius: 10px;
      padding: 8px 10px;
      line-height: 1.35;
    }
    .modal-hint.visible { display: block; }
  </style>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <div class="top-bar">
    <a class="button" href="index.html">← Back to hub</a>
  </div>
  <div class="top-bar" style="left:auto; right:80px;">
    <a class="button" href="tiktok.html">🎵 TikTok plans</a>
  </div>
  <main class="screen">
    <h1>Calendar</h1>
    <p class="subtitle">Click a day to add · click an event to edit</p>
    <div class="calendar-header">
      <button class="button" id="prevMonth">←</button>
      <h2 id="monthLabel"></h2>
      <button class="button" id="nextMonth">→</button>
      <button class="button" id="todayBtn">Today</button>
    </div>
    <p class="now-line" id="nowLabel"></p>
    <div class="calendar-grid" id="weekdayRow"></div>
    <div class="calendar-grid" id="daysGrid"></div>
  </main>

  <div class="modal" id="eventModal">
    <div class="modal-card">
      <h3 style="margin:0; color:#2873a6;" id="eventModalTitle">Add event</h3>
      <div class="modal-date" id="eventDateLabel"></div>
      <div class="modal-hint" id="eventHint"></div>
      <div class="title-row">
        <input id="eventTitle" placeholder="Title">
        <input id="eventStart" type="time" aria-label="Event time" title="Event time">
      </div>
      <textarea id="eventTime" rows="2" placeholder="Details (optional)"></textarea>
      <div class="modal-actions">
        <button class="button danger" id="deleteEvent" type="button" style="display:none;">Delete</button>
        <button class="button" id="cancelEvent" type="button">Cancel</button>
        <button class="button" id="saveEvent" type="button">Save</button>
      </div>
    </div>
  </div>

  <script>
    const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const monthLabel = document.getElementById('monthLabel');
    const weekdayRow = document.getElementById('weekdayRow');
    const daysGrid = document.getElementById('daysGrid');
    const prevMonth = document.getElementById('prevMonth');
    const nextMonth = document.getElementById('nextMonth');
    const modal = document.getElementById('eventModal');
    const eventTitle = document.getElementById('eventTitle');
    const eventTime = document.getElementById('eventTime');
    const cancelEvent = document.getElementById('cancelEvent');
    const saveEvent = document.getElementById('saveEvent');
    const deleteEvent = document.getElementById('deleteEvent');
    const modalTitle = document.getElementById('eventModalTitle');
    const eventHint = document.getElementById('eventHint');
    const eventStart = document.getElementById('eventStart');
    const eventDateLabel = document.getElementById('eventDateLabel');
    const todayBtn = document.getElementById('todayBtn');
    const nowLabel = document.getElementById('nowLabel');

    let current = new Date();
    let selectedDate = null;
    let editing = null;
    let events = {};
    let currentSha = null;
    let lastTickKey = '';

    weekdays.forEach(w => {
      const el = document.createElement('div');
      el.className = 'weekday';
      el.textContent = w;
      weekdayRow.appendChild(el);
    });

    function pad2(n) {
      return String(n).padStart(2, '0');
    }

    function dateKeyOf(date) {
      return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
    }

    function todayKey() {
      return dateKeyOf(new Date());
    }

    function minutesOfDay(value) {
      const match = /^(\d{1,2}):(\d{2})$/.exec(String(value || ''));
      if (!match) return null;
      const hours = Number(match[1]);
      const minutes = Number(match[2]);
      if (hours > 23 || minutes > 59) return null;
      return hours * 60 + minutes;
    }

    function formatClock(value) {
      const mins = minutesOfDay(value);
      if (mins === null) return String(value || '');
      const date = new Date(2000, 0, 1, Math.floor(mins / 60), mins % 60);
      return date.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
    }

    function formatDayLabel(dateKey) {
      const date = new Date(dateKey + 'T00:00:00');
      if (Number.isNaN(date.getTime())) return dateKey;
      return date.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    }

    // 'now' while the event is happening, 'soon' before it starts today, 'done' after it.
    function eventStatus(dateKey, startTime) {
      const startMins = minutesOfDay(startTime);
      if (startMins === null) return '';
      const today = todayKey();
      if (dateKey < today) return 'done';
      if (dateKey > today) return 'soon';

      const now = new Date();
      const nowMins = now.getHours() * 60 + now.getMinutes();
      if (nowMins < startMins) return 'soon';
      if (nowMins < startMins + 90) return 'now';
      return 'done';
    }

    function statusLabel(dateKey, startTime) {
      const status = eventStatus(dateKey, startTime);
      if (status === 'now') return 'Now';
      if (status === 'done') return dateKey === todayKey() ? 'Done' : '';
      if (status !== 'soon' || dateKey !== todayKey()) return '';

      const startMins = minutesOfDay(startTime);
      if (startMins === null) return '';
      const now = new Date();
      const diff = startMins - (now.getHours() * 60 + now.getMinutes());
      if (diff <= 0) return 'Soon';
      if (diff < 60) return `in ${diff} min`;
      const hours = Math.floor(diff / 60);
      const mins = diff % 60;
      return `in ${hours}h${mins ? ' ' + mins + 'm' : ''}`;
    }

    function formatNowLine() {
      const now = new Date();
      const date = now.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
      const time = now.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
      return `${date} · ${time}`;
    }

    function updateNowLine() {
      nowLabel.innerHTML = `<span>It is</span> ${escapeHtml(formatNowLine())}`;
    }

    function sortDayEvents(list) {
      return list
        .map((event, index) => ({ event, index }))
        .sort((a, b) => {
          const am = minutesOfDay(a.event.startTime);
          const bm = minutesOfDay(b.event.startTime);
          if (am !== null && bm !== null) return am - bm;
          if (am !== null) return -1;
          if (bm !== null) return 1;
          return a.index - b.index;
        });
    }

    function jumpToHash() {
      const match = /^#(\d{4})-(\d{2})-(\d{2})$/.exec(window.location.hash || '');
      if (!match) return;
      const year = Number(match[1]);
      const month = Number(match[2]) - 1;
      const day = Number(match[3]);
      const date = new Date(year, month, day);
      if (!Number.isNaN(date.getTime())) current = new Date(year, month, 1);
    }

    async function loadEvents() {
      try {
        const res = await fetch('/api/calendar');
        const json = await res.json();
        events = json.events || {};
        currentSha = json.sha || null;
      } catch (e) {
        events = {};
        currentSha = null;
      }
      jumpToHash();
      updateNowLine();
      render();
    }

    window.addEventListener('hashchange', () => {
      jumpToHash();
      render();
    });

    function render() {
      daysGrid.innerHTML = '';
      const year = current.getFullYear();
      const month = current.getMonth();
      monthLabel.textContent = current.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
      const first = new Date(year, month, 1);
      const last = new Date(year, month + 1, 0);
      const startDay = first.getDay();
      const totalDays = last.getDate();

      for (let i = 0; i < startDay; i++) {
        const pad = new Date(year, month, -(startDay - 1 - i));
        const el = document.createElement('div');
        el.className = 'day muted';
        el.innerHTML = `<div class="day-header"><span class="day-number">${pad.getDate()}</span></div>`;
        daysGrid.appendChild(el);
      }

      const today = todayKey();

      for (let d = 1; d <= totalDays; d++) {
        const dateKey = `${year}-${pad2(month + 1)}-${pad2(d)}`;
        const isToday = dateKey === today;
        const el = document.createElement('div');
        el.className = 'day' + (isToday ? ' today' : '');
        const todayTag = isToday ? '<span class="today-tag">Today</span>' : '';
        el.innerHTML = `<div class="day-header"><span class="day-number">${d}</span>${todayTag}<button class="add-btn" title="Add event">+</button></div>`;
        el.title = 'Click to add an event';
        el.addEventListener('click', (e) => {
          if (e.target.closest('.event') || e.target.closest('.add-btn')) return;
          openAdd(dateKey);
        });
        el.querySelector('.add-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          openAdd(dateKey);
        });

        sortDayEvents(events[dateKey] || []).forEach(({ event: ev, index }) => {
          const status = eventStatus(dateKey, ev.startTime);
          const evEl = document.createElement('div');
          evEl.className = 'event' + (status ? ' ' + status : '');
          evEl.title = 'Click to edit';

          const top = document.createElement('div');
          top.className = 'event-top';
          const strong = document.createElement('strong');
          strong.textContent = ev.title || '';
          top.appendChild(strong);
          if (ev.startTime) {
            const clock = document.createElement('span');
            clock.className = 'event-clock';
            clock.textContent = formatClock(ev.startTime);
            top.appendChild(clock);
          }
          evEl.appendChild(top);

          if (ev.time) {
            const details = document.createElement('div');
            details.className = 'event-details';
            details.textContent = ev.time;
            evEl.appendChild(details);
          }

          const label = statusLabel(dateKey, ev.startTime);
          if (label) {
            const badge = document.createElement('span');
            badge.className = 'event-badge';
            badge.textContent = label;
            evEl.appendChild(badge);
          }

          if (ev.author) {
            const by = document.createElement('small');
            by.className = 'event-by';
            by.textContent = 'By ' + ev.author;
            evEl.appendChild(by);
          }

          evEl.addEventListener('click', (e) => {
            e.stopPropagation();
            openEdit(dateKey, index);
          });
          el.appendChild(evEl);
        });
        daysGrid.appendChild(el);
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function showModal() {
      modal.classList.add('active');
      eventTitle.focus();
    }

    function closeModal() {
      modal.classList.remove('active');
      editing = null;
      selectedDate = null;
      deleteEvent.style.display = 'none';
      eventHint.classList.remove('visible');
    }

    function openAdd(key) {
      selectedDate = key;
      editing = null;
      modalTitle.textContent = 'Add event';
      eventDateLabel.textContent = formatDayLabel(key);
      eventTitle.value = '';
      eventStart.value = '';
      eventTime.value = '';
      deleteEvent.style.display = 'none';
      eventHint.classList.remove('visible');
      showModal();
    }

    function openEdit(key, index) {
      const ev = events[key] && events[key][index];
      if (!ev) return;
      selectedDate = key;
      editing = { date: key, index, id: ev.id || '', event: ev };
      modalTitle.textContent = 'Edit event';
      eventDateLabel.textContent = formatDayLabel(key);
      eventTitle.value = ev.title || '';
      eventStart.value = ev.startTime || '';
      eventTime.value = ev.time || '';

      const isTikTok = ev.source === 'tiktok';
      deleteEvent.style.display = isTikTok ? 'none' : '';
      if (isTikTok) {
        eventHint.textContent = 'This event came from one of our TikTok plans. We can tweak it here, but it will reset if that plan changes. Edit the plan to make a lasting change.';
        eventHint.classList.add('visible');
      } else {
        eventHint.classList.remove('visible');
      }
      showModal();
    }

    cancelEvent.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('active')) closeModal();
    });

    saveEvent.addEventListener('click', async () => {
      if (!selectedDate && !editing) return;
      const title = eventTitle.value.trim();
      if (!title) {
        eventTitle.focus();
        return;
      }
      const author = localStorage.getItem('charlotte-user') || 'Unknown';
      const event = { title, startTime: eventStart.value || '', time: eventTime.value.trim(), author, date: new Date().toLocaleString() };
      saveEvent.disabled = true;
      try {
        const target = editing ? { ...editing } : null;
        const isEdit = !!target;
        const addDate = selectedDate;
        const payload = isEdit
          ? { action: 'update', date: target.date, index: target.index, id: target.id, event }
          : { date: addDate, event };

        const res = await fetch('/api/calendar', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Failed to save');
        currentSha = json.sha || currentSha;

        if (isEdit) {
          const list = events[target.date] || [];
          if (list[target.index]) {
            list[target.index] = { ...list[target.index], title, startTime: event.startTime, time: event.time, id: list[target.index].id || json.id, editedAt: new Date().toISOString() };
          }
        } else {
          if (!events[addDate]) events[addDate] = [];
          events[addDate].push({ ...event, id: json.id });
        }
        closeModal();
        render();
      } catch (e) {
        siteDialog.alert('Error: ' + e.message);
      } finally {
        saveEvent.disabled = false;
      }
    });

    deleteEvent.addEventListener('click', async () => {
      if (!editing) return;
      const target = { ...editing };
      const label = target.event.title || 'this event';
      if (!await siteDialog.confirm('Delete "' + label + '"?')) return;
      deleteEvent.disabled = true;
      try {
        const res = await fetch('/api/calendar', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ action: 'delete', date: target.date, index: target.index, id: target.id })
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Failed to delete');
        currentSha = json.sha || currentSha;
        const list = events[target.date] || [];
        list.splice(target.index, 1);
        if (list.length === 0) delete events[target.date];
        closeModal();
        render();
      } catch (e) {
        siteDialog.alert('Error: ' + e.message);
      } finally {
        deleteEvent.disabled = false;
      }
    });

    prevMonth.addEventListener('click', () => { current.setMonth(current.getMonth() - 1); render(); });
    nextMonth.addEventListener('click', () => { current.setMonth(current.getMonth() + 1); render(); });
    todayBtn.addEventListener('click', () => {
      current = new Date();
      render();
    });

    function tick() {
      updateNowLine();
      const now = new Date();
      const key = dateKeyOf(now) + ' ' + now.getHours() + ':' + now.getMinutes();
      if (key === lastTickKey) return;
      lastTickKey = key;
      if (!modal.classList.contains('active')) render();
    }

    tick();
    setInterval(tick, 15000);
    loadEvents();
  </script>
  <script src="avatar.js"></script>
  <script src="dialog.js"></script>
</body>
</html>
