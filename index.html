<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our little hub</title>
  <script>
    if (!localStorage.getItem('charlotte-user')) {
      window.location.href = 'login.html';
    }
  </script>
  <style>
    :root {
      --sky: #a4deff;
      --deep-blue: #245b85;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", Arial, sans-serif;
      background: linear-gradient(145deg, #c8edff, var(--sky) 55%, #8ccfff);
      color: var(--deep-blue);
      display: grid;
      place-items: center;
      overflow-x: hidden;
    }

    .screen {
      width: min(900px, 100%);
      min-height: 100vh;
      padding: 28px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 16px;
    }

    h1 {
      margin: 0;
      color: var(--white);
      font-size: clamp(2.2rem, 7vw, 4.2rem);
      text-shadow: 0 3px 14px #428ec080;
    }

    .subtitle {
      margin: 0 0 10px;
      color: #fff;
      font-size: clamp(1rem, 3vw, 1.25rem);
      text-shadow: 0 2px 8px #428ec080;
    }

    .hub-grid {
      width: min(880px, 92vw);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .hub-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      border-radius: 18px;
      padding: 22px 18px;
      background: #ffffffee;
      color: #2873a6;
      font-weight: 800;
      font-size: clamp(1.05rem, 2.6vw, 1.3rem);
      box-shadow: 0 12px 30px #347eac30;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      border: 1px solid #ffffff;
    }

    .hub-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 38px #347eac40;
    }

    .hub-card:focus-visible {
      outline: 3px solid #245b85;
      outline-offset: 4px;
    }

    .hub-card small {
      font-weight: 600;
      color: #3b7db3;
      font-size: clamp(0.9rem, 2vw, 0.98rem);
    }

    .footer-note {
      margin-top: 18px;
      color: #ffffff;
      font-size: 0.95rem;
      text-shadow: 0 1px 6px #428ec080;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="screen">
    <h1>Our little hub</h1>
    <p class="subtitle">Pick a section to explore</p>
    <div class="hub-grid">
      <a class="hub-card" href="love.html">
        <span>🤍 Love you</span>
        <small>The heart & little memory</small>
      </a>
      <a class="hub-card" href="messages.html">
        <span>Notes</span>
        <small>Messages for you</small>
      </a>
      <a class="hub-card" href="calendar.html">
        <span>Calendar</span>
        <small>Events & dates</small>
      </a>
      <a class="hub-card" href="gallery.html">
        <span>Gallery</span>
        <small>Photos together</small>
      </a>
      <a class="hub-card" href="timeline.html">
        <span>Our timeline</span>
        <small>Little moments</small>
      </a>
      <a class="hub-card" href="profile.html">
        <span>Profile</span>
        <small>Profile picture & account</small>
      </a>
    </div>
    <p class="footer-note">Made with care</p>
  </main>
</body>
</html>
