<!DOCTYPE html>
<html lang="en">
<head>
  <script src="site-shell-guard.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings</title>
  <style>
    :root { --sky: #a4deff; --deep-blue: #245b85; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", Arial, sans-serif;
      background: linear-gradient(145deg, #c8edff, var(--sky) 55%, #8ccfff);
      color: var(--deep-blue);
      display: grid;
      place-items: center;
    }
    .card {
      width: min(420px, 92vw);
      background: #ffffffee;
      border-radius: 18px;
      box-shadow: 0 12px 30px #347eac30;
      padding: 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      text-align: center;
    }
    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      background: #e8f6ff;
      box-shadow: 0 10px 24px #347eac25;
    }
    .button {
      border: 0;
      border-radius: 999px;
      padding: 12px 22px;
      background: white;
      color: #2873a6;
      font-size: 0.98rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 7px 20px #347eac35;
      cursor: pointer;
    }
    .top-bar { position: absolute; top: 16px; left: 16px; }
    .subtitle {
      margin: -6px 0 0;
      color: #3b7db3;
      font-size: 0.98rem;
    }
    .section-title {
      width: 100%;
      margin: 6px 0 -4px;
      text-align: left;
      color: #2873a6;
      font-size: 1rem;
    }
    .settings-row{width:100%;display:grid;gap:7px;text-align:left;color:#486a83;font-size:.9rem;font-weight:700}.settings-row select,.settings-row input[type=color]{width:100%;min-height:44px;padding:9px 12px;border:1px solid #c8dceb;border-radius:13px;background:#fffefa;color:#174866;font:inherit}.settings-row input[type=color]{height:48px;padding:5px}.setting-check{display:flex;align-items:flex-start;gap:10px;width:100%;padding:13px;border:1px solid #dce9ef;border-radius:14px;background:#f4f9fb;color:#486a83;text-align:left;line-height:1.45}.setting-check input{margin-top:3px;accent-color:#347fa3}.settings-help,.settings-status{width:100%;margin:0;color:#607e92;font-size:.84rem;line-height:1.5;text-align:left}.settings-status{min-height:1.4em;color:#73591f;font-weight:700}
  </style>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <div class="top-bar">
    <a class="button" href="index.html">← Back to hub</a>
  </div>
  <div class="card">
    <h1>Settings</h1>
    <p class="subtitle">Signed in as <strong id="username"></strong></p>
    <h2 class="section-title">Profile picture</h2>
    <img id="avatar" class="avatar" src="https://ui-avatars.com/api/?name=User&background=e8f6ff&color=2873a6&size=256" alt="Profile picture">
    <input type="file" id="avatarInput" accept="image/*">
    <button class="button" id="saveAvatar">Save profile picture</button>
    <h2 class="section-title">Our look and reminders</h2>
    <label class="settings-row" for="themeChoice">Site theme<select id="themeChoice"><option value="blue">Quiet blue (softer)</option><option value="midnight">Blue dusk</option><option value="lavender">Lavender cloud</option><option value="sage">Soft sage</option><option value="sunset">Warm sunset</option></select></label>
    <label class="settings-row" for="accentChoice">Choose our accent color<input id="accentChoice" type="color" value="#347fa3"></label>
    <label class="setting-check"><input id="birthdayReminders" type="checkbox" checked><span>Remind me about our birthdays and anniversary the day before and on the day</span></label>
    <p class="settings-help">Special dates: Charlotte · 9 March · Luke · 21 July · our anniversary · 26 October. Reminders appear while our website is open; browser notifications must be allowed on this device.</p>
    <button class="button" id="enableNotifications" type="button">Enable browser notifications</button>
    <button class="button" id="savePreferences" type="button">Save appearance &amp; reminders</button>
    <p class="settings-status" id="preferencesStatus" role="status"></p>
    <h2 class="section-title">Account</h2>
    <button class="button" id="logout">Logout</button>
  </div>

  <script>
    if (!localStorage.getItem('charlotte-user')) {
      window.location.href = 'login.html';
    }
    const user = localStorage.getItem('charlotte-user');
    document.getElementById('username').textContent = user;
    const avatar = document.getElementById('avatar');
    const avatarInput = document.getElementById('avatarInput');
    const saveAvatar = document.getElementById('saveAvatar');
    const themeChoice = document.getElementById('themeChoice');
    const accentChoice = document.getElementById('accentChoice');
    const birthdayReminders = document.getElementById('birthdayReminders');
    const preferencesStatus = document.getElementById('preferencesStatus');
    const preferenceKey = 'charlotte-preferences-' + user;
    function applyPreferences(preferences) {
      if (!preferences) return;
      themeChoice.value = preferences.theme || 'blue';
      accentChoice.value = preferences.accent || '#347fa3';
      birthdayReminders.checked = preferences.birthdayReminders !== false;
      document.documentElement.dataset.coupleTheme = themeChoice.value;
      document.documentElement.style.setProperty('--couple-accent', accentChoice.value);
      localStorage.setItem(preferenceKey, JSON.stringify({ theme: themeChoice.value, accent: accentChoice.value, birthdayReminders: birthdayReminders.checked }));
      window.dispatchEvent(new CustomEvent('charlotte-preferences', { detail: preferences }));
      if (window.parent !== window) window.parent.postMessage({ type: 'charlotte-theme', preferences: { theme: themeChoice.value, accent: accentChoice.value } }, location.origin);
    }
    try { applyPreferences(JSON.parse(localStorage.getItem(preferenceKey) || 'null')); } catch (e) {}
    fetch('/api/question-room?view=preferences&user=' + encodeURIComponent(user), { cache: 'no-store' }).then(res => res.json()).then(applyPreferences).catch(() => {});
    document.getElementById('savePreferences').addEventListener('click', async () => {
      const preferences = { theme: themeChoice.value, accent: accentChoice.value, birthdayReminders: birthdayReminders.checked };
      const button = document.getElementById('savePreferences'); button.disabled = true; preferencesStatus.textContent = 'Saving our settings…';
      try {
        const response = await fetch('/api/question-room', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action: 'preferences', user, preferences }) });
        const result = await response.json(); if (!response.ok) throw new Error(result.error || 'Could not save settings.');
        applyPreferences(result.preferences); preferencesStatus.textContent = 'Our preferences are saved for this profile.';
        if (preferences.birthdayReminders && 'Notification' in window && Notification.permission === 'default') preferencesStatus.textContent += ' Allow notifications here to receive reminders.';
      } catch (error) { preferencesStatus.textContent = error.message; }
      finally { button.disabled = false; }
    });
    themeChoice.addEventListener('change', () => { document.documentElement.dataset.coupleTheme = themeChoice.value; });
    accentChoice.addEventListener('input', () => document.documentElement.style.setProperty('--couple-accent', accentChoice.value));
    document.getElementById('enableNotifications').addEventListener('click', async () => {
      if (!('Notification' in window)) { preferencesStatus.textContent = 'This browser does not support notifications.'; return; }
      try {
        const permission = await Notification.requestPermission();
        preferencesStatus.textContent = permission === 'granted' ? 'Browser notifications are enabled on this device. Save our settings to keep reminders on.' : 'Notifications were not enabled. We can change that in browser settings later.';
      } catch (error) { preferencesStatus.textContent = 'This browser could not enable notifications here. We can check its notification settings.'; }
    });
    
    async function loadProfile() {
      try {
        const res = await fetch('/api/profile?user=' + encodeURIComponent(user));
        const json = await res.json();
        if (json.url) avatar.src = json.url;
      } catch (e) {}
    }
    loadProfile();
    
    let selectedFile = null;
    avatarInput.addEventListener('change', (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      selectedFile = file;
      const reader = new FileReader();
      reader.onload = () => {
        avatar.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
    
    saveAvatar.addEventListener('click', async () => {
      if (!selectedFile) {
        siteDialog.alert('Select a picture first');
        return;
      }
      saveAvatar.disabled = true;
      saveAvatar.textContent = 'Saving...';
      try {
        const data = new FormData();
        data.append('avatar', selectedFile);
        data.append('user', user);
        const res = await fetch('/api/profile', {
          method: 'POST',
          body: data
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Failed');
        if (json.url) {
          avatar.src = json.url;
          localStorage.setItem('charlotte-avatar-' + user, json.url);
        }
        siteDialog.alert('Profile picture saved!');
      } catch (e) {
        siteDialog.alert(e.message);
      } finally {
        saveAvatar.disabled = false;
        saveAvatar.textContent = 'Save profile picture';
      }
    });
    
    document.getElementById('logout').addEventListener('click', () => {
      localStorage.removeItem('charlotte-user');
      window.location.href = 'login.html';
    });
  </script>
  <script src="dialog.js"></script>
  <script src="avatar.js"></script>
</body>
</html>
