<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Lover Boy</title>
  <script>
    if (!localStorage.getItem('charlotte-user')) {
      window.location.href = 'login.html';
    }
  </script>
  <style>
    :root {
      --gold: #ecd7a0;
      --display: Georgia, "Times New Roman", serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: #10344f;
    }

    .hidden { display: none; }

    .screen {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      padding: clamp(76px, 11vh, 96px) 18px clamp(30px, 6vh, 52px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* ---------- Opening: our photo behind the heart ---------- */

    .opening {
      color: #fff;
      overflow: hidden;
      isolation: isolate;
    }

    .opening::before {
      content: "";
      position: absolute;
      inset: -2%;
      z-index: -2;
      background: url('holding-hands.jpg') center 32% / cover no-repeat;
      animation: breathe 34s ease-in-out infinite alternate;
    }

    .opening::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(70% 55% at 50% 28%, rgba(5, 22, 37, 0.18) 0%, rgba(5, 22, 37, 0.78) 100%),
        linear-gradient(180deg, rgba(5, 21, 35, 0.52) 0%, rgba(6, 24, 40, 0.6) 46%, rgba(5, 19, 32, 0.9) 100%);
    }

    @keyframes breathe {
      from { transform: scale(1.02); }
      to { transform: scale(1.09); }
    }

    .opening .eyebrow {
      color: var(--gold);
      text-shadow: 0 2px 12px rgba(3, 15, 26, 0.6);
    }

    h1 {
      margin: 12px 0 6px;
      font-family: var(--display);
      font-weight: 400;
      color: #fff;
      font-size: clamp(2.3rem, 7.5vw, 4.4rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
      text-shadow: 0 4px 28px rgba(3, 15, 26, 0.55);
    }

    .subtitle {
      margin: 0 0 10px;
      color: #e6f3fc;
      font-size: clamp(0.98rem, 2.6vw, 1.12rem);
      text-shadow: 0 2px 12px rgba(3, 15, 26, 0.6);
    }

    .heart-area {
      position: relative;
      width: min(88vw, 440px);
      height: min(62vw, 38vh, 340px);
      min-height: 210px;
      margin: 4px auto 10px;
    }

    .love-word {
      position: absolute;
      transform: translate(-50%, -50%);
      color: #ffffff;
      font-family: var(--display);
      font-weight: 700;
      font-size: clamp(0.78rem, 2.6vw, 1.06rem);
      white-space: nowrap;
      text-shadow: 0 2px 12px rgba(2, 12, 21, 0.85);
      animation: float 3.4s ease-in-out infinite;
      user-select: none;
    }

    .love-word:nth-child(3n) { animation-delay: -1s; }
    .love-word:nth-child(3n + 1) { animation-delay: -2s; }

    @keyframes float {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -5px; }
    }

    .together {
      color: #fff;
      padding: 14px 6px;
      border-radius: 20px;
      background: rgba(9, 32, 51, 0.36);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 20px 46px rgba(3, 15, 26, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.16);
      -webkit-backdrop-filter: blur(14px) saturate(1.1);
      backdrop-filter: blur(14px) saturate(1.1);
    }

    .together-since {
      margin: 10px 0 0;
      color: #d9ebf7;
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      text-shadow: 0 1px 10px rgba(3, 15, 26, 0.6);
    }

    /* ---------- Buttons ---------- */

    .button {
      border: 0;
      border-radius: 999px;
      padding: 13px 26px;
      background: #ffffff;
      color: #1c5275;
      font-family: inherit;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(4, 20, 33, 0.32);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 34px rgba(4, 20, 33, 0.4);
    }

    .button:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 4px;
    }

    .reveal-button { margin-top: 16px; }
    .back-button { margin-top: 22px; }

    .hint {
      margin: 10px 0 0;
      color: #e2f0fa;
      font-size: 0.84rem;
      letter-spacing: 0.08em;
      text-shadow: 0 1px 8px rgba(3, 15, 26, 0.6);
    }

    /* ---------- The memory ---------- */

    .memory { padding-top: 96px; }

    .memory .eyebrow { color: #8a6d2b; }

    .memory h1 {
      margin-top: 10px;
      color: #123a58;
      font-size: clamp(2rem, 6vw, 3.2rem);
      text-shadow: none;
    }

    .photo-frame {
      width: min(88vw, 620px);
      margin-top: 18px;
      padding: 12px;
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 26px 60px rgba(20, 63, 95, 0.28);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
    }

    .photo-frame img {
      display: block;
      width: 100%;
      max-height: 62vh;
      min-height: 240px;
      object-fit: cover;
      border-radius: 18px;
      background: #d9f1ff;
    }

    #photoFallback { color: #245b85; }

    .photo-caption {
      margin: 20px 0 0;
      color: #1c5275;
      font-family: var(--display);
      font-size: clamp(1.25rem, 4vw, 1.8rem);
      font-style: italic;
    }

    .top-bar {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 5;
    }

    .top-bar .button { background: rgba(255, 255, 255, 0.9); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <div class="top-bar">
    <a class="button" href="index.html">← Back to hub</a>
  </div>

  <main>
    <section class="screen opening" id="opening">
      <p class="eyebrow">Charlotte &amp; Luke</p>
      <h1 id="heading">Love you, Charlotte</h1>
      <p class="subtitle">A little something made just for you.</p>
      <div class="heart-area" id="heart" aria-label="Love you words arranged in a heart"></div>
      <div class="together" data-together role="timer" aria-label="Time we have been together"></div>
      <p class="together-since">Since 26 October 2026 · 5:46 pm</p>
      <button class="button reveal-button" id="revealButton" type="button">One more thing…</button>
      <p class="hint">Made with care</p>
    </section>

    <section class="screen memory hidden" id="memory">
      <p class="eyebrow">One more thing</p>
      <h1>A little memory</h1>
      <div class="photo-frame">
        <img id="memoryPhoto" src="holding-hands.jpg" alt="A favourite memory together"
          onerror="this.onerror=null; this.style.display='none'; document.getElementById('photoFallback').style.display='block';">
        <div id="photoFallback" style="display:none; padding:45px 12px;">
          <strong>Your photo goes here</strong>
          <p>Put the photo in the same folder as index.html and name it <code>holding-hands.jpg</code>.</p>
        </div>
      </div>
      <p class="photo-caption">Thanks for being you.</p>
      <button class="button back-button" id="backButton" type="button">Back to the heart</button>
    </section>
  </main>

  <script>
    const heart = document.getElementById("heart");

    const heartPositions = [
      [28, 16], [37, 11], [46, 13], [54, 13], [63, 11], [72, 16],
      [22, 24], [31, 25], [40, 23], [49, 24], [58, 23], [67, 25], [78, 24],
      [24, 34], [34, 34], [44, 34], [54, 34], [64, 34], [76, 34],
      [29, 44], [39, 44], [49, 44], [59, 44], [69, 44],
      [35, 54], [45, 54], [55, 54], [65, 54],
      [41, 64], [51, 64], [61, 64],
      [46, 74], [56, 74],
      [51, 84]
    ];

    heartPositions.forEach(([x, y], index) => {
      const word = document.createElement("span");
      word.className = "love-word";
      word.textContent = index % 4 === 0 ? "Love you 🤍" : "Love you";
      word.style.left = x + "%";
      word.style.top = y + "%";
      heart.appendChild(word);
    });

    const opening = document.getElementById("opening");
    const memory = document.getElementById("memory");

    document.getElementById("revealButton").addEventListener("click", () => {
      opening.classList.add("hidden");
      memory.classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    document.getElementById("backButton").addEventListener("click", () => {
      memory.classList.add("hidden");
      opening.classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  </script>
  <script src="together.js"></script>
  <script src="avatar.js"></script>
</body>
</html>
