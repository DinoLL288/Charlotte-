<!DOCTYPE html>
<html lang="en">
<head>
  <script src="site-shell-guard.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Discoveries</title>
  <script>if (!localStorage.getItem('charlotte-user')) window.location.href = 'login.html';</script>
  <link rel="stylesheet" href="theme.css">
  <style>
    body { margin: 0; min-height: 100vh; font-family: var(--font-body); background: linear-gradient(160deg,#eaf7ff,#c3e6fb 42%,#8ecbeb 100%); color: #10344f; padding: 24px 16px 60px; }
    .wrap { width: min(900px, 100%); margin: 0 auto; }
    h1 { font-family: var(--font-display); color: #123a58; font-size: clamp(2rem,5vw,2.8rem); margin: 0 0 6px; }
    .sub { color: #4a7291; max-width: 60ch; line-height: 1.6; margin: 0 0 20px; }
    .board { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
    .score { padding: 18px; border-radius: 18px; background: rgba(255,255,255,.8); border: 1px solid rgba(255,255,255,.9); text-align: center; }
    .score strong { display: block; font-size: 2.4rem; color: #8a6d2b; }
    .score span { color: #4a7291; font-size: .9rem; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    .button { padding: 10px 16px; border-radius: 999px; background: #123a58; color: #fff; text-decoration: none; font-weight: 700; font-size: .9rem; }
    .button.secondary { background: #edf4f8; color: #123a58; }
    .finds { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 8px; }
    .find { display: grid; place-items: center; padding: 10px; border-radius: 14px; background: rgba(255,255,255,.75); border: 1px solid rgba(255,255,255,.9); font-size: 1.3rem; }
    .find small { font-size: .65rem; color: #4a7291; }
    .empty { color: #4a7291; padding: 20px; text-align: center; }
    @media (max-width: 640px) { .board { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="top-bar"><a class="button secondary" href="index.html">← Back to hub</a></div>
  <div class="wrap">
    <h1>Discoveries</h1>
    <p class="sub">Every little thing we find adds tokens. Spend them in the bubble popping game.</p>
    <div class="board">
      <div class="score"><strong id="charlotteTokens">0</strong><span>Charlotte tokens</span></div>
      <div class="score"><strong id="lukeTokens">0</strong><span>Luke tokens</span></div>
    </div>
    <div class="actions">
      <a class="button" href="bubble-pop.html">Play bubble popping</a>
      <a class="button secondary" href="index.html">Find more</a>
    </div>
    <h2 style="font-family:var(--font-display);color:#123a58;">All found</h2>
    <div class="finds" id="finds"></div>
    <p class="empty" id="empty">No discoveries yet. Tap the hidden things around the pages.</p>
  </div>
  <script src="avatar.js"></script>
  <script>
    (function () {
      const user = localStorage.getItem('charlotte-user');
      function render(state) {
        document.getElementById('charlotteTokens').textContent = (state.tokens && state.tokens.Charlotte) || 0;
        document.getElementById('lukeTokens').textContent = (state.tokens && state.tokens.Luke) || 0;
        const finds = state.finds || [];
        const box = document.getElementById('finds');
        box.innerHTML = '';
        if (!finds.length) { document.getElementById('empty').hidden = false; return; }
        document.getElementById('empty').hidden = true;
        finds.slice().reverse().forEach(function (f) {
          const d = document.createElement('div');
          d.className = 'find';
          d.textContent = f.emoji || '✨';
          d.title = (f.user || '') + ' · ' + (f.rare ? 'rare' : 'found') + ' · ' + new Date(f.at).toLocaleString();
          box.appendChild(d);
        });
      }
      fetch('/api/question-room?view=playful-state', { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(render)
        .catch(function () {});
    })();
  </script>
</body>
</html>
