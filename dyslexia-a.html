<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout A Â· One thing at a time</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    body{margin:0;min-height:100vh;font-family:var(--font-body);background:linear-gradient(160deg,#c8edff,#a9dcf7 55%,#8ccfff);color:#10344f}
    .preview-banner{position:sticky;top:0;z-index:50;padding:10px 16px;text-align:center;background:#143f5f;color:#fff;font-size:.85rem;font-weight:700}
    .preview-banner a{color:#ecd7a0;margin-left:12px}
    .hero{padding:50px 20px 20px;text-align:center;color:#fff;background:linear-gradient(160deg,rgba(13,44,68,.85),rgba(42,120,168,.85))}
    .hero h1{margin:8px 0 4px;font-family:var(--font-display);font-size:clamp(2rem,6vw,2.8rem);font-weight:400}
    .hero p{margin:0 auto;max-width:40ch;color:#eaf6ff;line-height:1.6;font-size:1.05rem}
    .carousel{width:min(420px,calc(100% - 32px));margin:30px auto 60px;position:relative}
    .card{padding:32px 24px;border-radius:24px;background:rgba(255,255,255,.9);border:2px solid #fff;box-shadow:0 18px 42px rgba(29,90,128,.15);text-align:center;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
    .card .icon{font-size:3rem}
    .card .title{font-family:var(--font-display);font-size:1.6rem;color:#123a58;font-weight:700}
    .card .sub{color:#4a7291;font-size:1rem;line-height:1.5;max-width:30ch}
    .nav{display:flex;justify-content:space-between;margin-top:16px}
    .nav button{padding:12px 24px;border:2px solid #143f5f;border-radius:999px;background:#143f5f;color:#fff;font:inherit;font-weight:700;font-size:1rem;cursor:pointer}
    .nav button.secondary{background:#fff;color:#143f5f}
    .dots{display:flex;justify-content:center;gap:8px;margin-top:12px}
    .dot{width:10px;height:10px;border-radius:50%;background:#c8dceb;transition:background .2s}
    .dot.active{background:#143f5f}
    .counter{text-align:center;margin-top:8px;color:#7b91a0;font-size:.85rem;font-weight:700}
  </style>
</head>
<body>
  <div class="preview-banner">Layout A Â· One thing at a time â€” single card focus, swipe to see more. <a href="dyslexia-layouts.html">Back to chooser</a></div>
  <header class="hero">
    <h1>Our little universe</h1>
    <p>One room at a time. Swipe to explore.</p>
  </header>
  <div class="carousel">
    <div class="card" id="card">
      <div class="icon">ðŸ¤</div>
      <div class="title">Our love</div>
      <div class="sub">The heart &amp; our little memory</div>
    </div>
    <div class="nav">
      <button class="secondary" id="prev">â† Back</button>
      <button id="next">Next â†’</button>
    </div>
    <div class="dots" id="dots"></div>
    <div class="counter" id="counter">1 of 12</div>
  </div>
  <script>
    const items = [
      {icon:'ðŸ¤',title:'Our love',sub:'The heart & our little memory'},
      {icon:'âœ‰ï¸',title:'Notes',sub:'Messages we leave for each other'},
      {icon:'ðŸ“·',title:'Photos & videos',sub:'Our albums and little movies'},
      {icon:'ðŸ“…',title:'Calendar',sub:'Dates, plans and countdowns'},
      {icon:'ðŸ’¬',title:'Question night',sub:'A shared room for us'},
      {icon:'ðŸŽ²',title:'Play & ask',sub:'Games and little questions'},
      {icon:'ðŸŒ™',title:'Quiet days',sub:'When one of us needs space'},
      {icon:'ðŸ“–',title:'Memory journal',sub:'Our diary of moments'},
      {icon:'ðŸ’›',title:'Mood tracker',sub:'How are we feeling today?'},
      {icon:'ðŸ†',title:'Achievements',sub:'Badges and milestones'},
      {icon:'ðŸŽ¨',title:'Stickers',sub:'Collect and decorate'},
      {icon:'ðŸ—ï¸',title:'Secrets',sub:'Puzzle hunts and hidden things'},
    ];
    let idx = 0;
    const card = document.getElementById('card');
    const dots = document.getElementById('dots');
    const counter = document.getElementById('counter');
    items.forEach((_,i)=>{ const d=document.createElement('div'); d.className='dot'+(i===0?' active':''); dots.appendChild(d); });
    function show(i){
      const it = items[i];
      card.querySelector('.icon').textContent = it.icon;
      card.querySelector('.title').textContent = it.title;
      card.querySelector('.sub').textContent = it.sub;
      dots.querySelectorAll('.dot').forEach((d,j)=>d.classList.toggle('active',j===i));
      counter.textContent = (i+1) + ' of ' + items.length;
      document.getElementById('prev').disabled = i===0;
      document.getElementById('next').disabled = i===items.length-1;
    }
    document.getElementById('prev').addEventListener('click',()=>{ if(idx>0){idx--;show(idx);} });
    document.getElementById('next').addEventListener('click',()=>{ if(idx<items.length-1){idx++;show(idx);} });
    show(0);
  </script>
  <script src="together.js"></script>
  <script src="avatar.js"></script>
</body>
</html>
