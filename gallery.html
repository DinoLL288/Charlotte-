<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery</title>
  <script>
    if (!localStorage.getItem('charlotte-user')) {
      window.location.href = 'login.html';
    }
  </script>
  <style>
    :root { --sky: #a4deff; --deep-blue: #245b85; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", Arial, sans-serif;
      background: linear-gradient(145deg, #c8edff, var(--sky) 55%, #8ccfff);
      color: var(--deep-blue);
    }
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(36, 91, 133, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .lightbox.active { display: flex; }
    .lightbox-content {
      max-width: 95vw;
      max-height: 95vh;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .lightbox-img {
      max-width: 95vw;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
    .lightbox-info {
      background: #ffffffee;
      padding: 10px 18px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(52,126,172,0.4);
    }
    .lightbox-pfp {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      background: #e8f6ff;
    }
    .lightbox-close {
      position: absolute;
      top: -44px;
      right: 0;
      background: white;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      cursor: pointer;
      font-size: 22px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }
    .screen {
      width: min(1100px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 80px 18px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
    }
    h1 { margin: 0; color: #fff; font-size: clamp(2rem, 6vw, 3.6rem); text-shadow: 0 3px 14px #428ec080; }
    .subtitle { margin: 0; color: #fff; font-size: clamp(1rem, 3vw, 1.2rem); text-shadow: 0 2px 8px #428ec080; }
    .upload-card {
      width: min(720px, 92vw);
      background: #ffffffee;
      border-radius: 18px;
      box-shadow: 0 12px 30px #347eac30;
      padding: clamp(16px, 4vw, 24px);
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    .upload-card form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      width: 100%;
    }
    .upload-card input[type="file"] {
      font-family: inherit;
    }
    .grid {
      width: min(1100px, 94vw);
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
      align-items: start;
    }
    .tile {
      border-radius: 12px;
      overflow: hidden;
      background: transparent;
      box-shadow: none;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tile img {
      width: 100%;
      height: auto;
      max-height: 400px;
      object-fit: contain;
      display: block;
      background: transparent;
    }
    .tile.empty {
      color: #3b7db3;
      text-align: center;
      padding: 16px;
    }
    .button {
      border: 0;
      border-radius: 999px;
      padding: 12px 22px;
      background: white;
      color: #2873a6;
      font-size: 0.98rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 7px 20px #347eac35;
      cursor: pointer;
    }
    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .top-bar { position: fixed; top: 16px; left: 16px; z-index: 5; }
    .status {
      color: #2873a6;
      font-size: 0.95rem;
      min-height: 1.2rem;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <a class="button" href="index.html">← Back to hub</a>
  </div>
  <main class="screen">
    <h1>Gallery</h1>
    <p class="subtitle">Photos together</p>
    <section class="upload-card">
      <strong>Upload a photo</strong>
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:center;">
        <div id="folderCheckboxes" style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center;"></div>
        <input id="newFolderInput" placeholder="New folder name" style="padding:10px 14px; border-radius:10px; border:1px solid #b9dcf5;">
        <button class="button" id="createFolderBtn" type="button">Add Folder</button>
      </div>
      <form id="uploadForm">
        <input id="photoInput" type="file" name="photo" accept="image/*" required>
        <button class="button" id="uploadBtn" type="submit">Upload to selected folders</button>
      </form>
      <div class="status" id="uploadStatus"></div>
    </section>
    <div id="folderView" style="display:flex; flex-direction:column; gap:16px; width:100%; align-items:center;"></div>
  </main>
  <div class="lightbox" id="lightbox">
    <div class="lightbox-content">
      <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Close">&times;</button>
      <img class="lightbox-img" id="lightboxImg" alt="Gallery photo">
      <div class="lightbox-info">
        <img class="lightbox-pfp" id="lightboxPfp" alt="Profile picture">
        <span id="lightboxName"></span>
      </div>
    </div>
  </div>
  <script>
    const form = document.getElementById('uploadForm');
    const input = document.getElementById('photoInput');
    const btn = document.getElementById('uploadBtn');
    const statusEl = document.getElementById('uploadStatus');
    const folderCheckboxes = document.getElementById('folderCheckboxes');
    const newFolderInput = document.getElementById('newFolderInput');
    const createFolderBtn = document.getElementById('createFolderBtn');
    const folderView = document.getElementById('folderView');

    let folders = [];

    function renderFolders() {
      folderCheckboxes.innerHTML = '';
      folders.forEach(f => {
        if (f === 'Old Photos' || f === 'General') return;
        const label = document.createElement('label');
        label.style.display = 'flex';
        label.style.alignItems = 'center';
        label.style.gap = '6px';
        label.style.background = '#ffffffee';
        label.style.padding = '8px 14px';
        label.style.borderRadius = '999px';
        label.style.boxShadow = '0 6px 16px #347eac20';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.value = f;
        cb.checked = false;
        label.appendChild(cb);
        label.appendChild(document.createTextNode(f));
        folderCheckboxes.appendChild(label);
      });
      renderGalleryView();
    }

    function renderGalleryView() {
      folderView.innerHTML = '';
      // Move General to front if exists
      const ordered = [...folders];
      const genIdx = ordered.indexOf('General');
      if (genIdx > 0) {
        ordered.splice(genIdx, 1);
        ordered.unshift('General');
      }
      ordered.forEach((folder, idx) => {
        const section = document.createElement('section');
        section.style.width = 'min(1100px, 94vw)';
        section.style.display = 'flex';
        section.style.flexDirection = 'column';
        section.style.gap = '10px';
        
        const header = document.createElement('button');
        header.type = 'button';
        header.style.background = 'linear-gradient(90deg, #ffffffee, #f0faff)';
        header.style.border = '1px solid #b9dcf5';
        header.style.borderRadius = '14px';
        header.style.padding = '10px 18px';
        header.style.color = '#2873a6';
        header.style.fontWeight = '800';
        header.style.cursor = 'pointer';
        header.style.boxShadow = '0 8px 18px #347eac18';
        header.style.textAlign = 'left';
        header.style.display = 'flex';
        header.style.alignItems = 'center';
        header.style.justifyContent = 'space-between';
        header.innerHTML = `<span>${(folder === 'General') ? '✨ General (All Photos)' : '📁 ' + folder}</span><span style="opacity:0.7;">▸</span>`;
        
        const grid = document.createElement('div');
        grid.className = 'grid';
        grid.dataset.folder = folder;
        grid.style.display = idx === 0 ? 'grid' : 'none';
        grid.style.transition = 'all 0.2s ease';
        
        header.addEventListener('click', () => {
          if (grid.style.display === 'grid') {
            grid.style.display = 'none';
            header.querySelector('span:last-child').textContent = '▸';
          } else {
            // Collapse others, open this one
            folderView.querySelectorAll('.grid').forEach(g => {
              g.style.display = 'none';
            });
            folderView.querySelectorAll('section button span:last-child').forEach(s => {
              s.textContent = '▸';
            });
            grid.style.display = 'grid';
            header.querySelector('span:last-child').textContent = '▾';
          }
        });
        
        if (idx === 0) {
          header.querySelector('span:last-child').textContent = '▾';
        }
        section.appendChild(header);
        section.appendChild(grid);
        folderView.appendChild(section);
        loadFolderPhotos(folder, grid);
      });
    }

    async function loadFolderPhotos(folder, grid) {
      try {
        if (folder === 'General' || folder === 'All Photos') {
          // Aggregate all photos from all folders
          const allPhotos = [];
          const seen = new Set();
          
          // Load Old Photos (root)
          try {
            const resRoot = await fetch('/api/gallery?folder=' + encodeURIComponent('root'));
            const jsonRoot = await resRoot.json();
            if (jsonRoot.photos) {
              jsonRoot.photos.forEach(p => {
                if (!seen.has(p.url)) {
                  seen.add(p.url);
                  allPhotos.push(p);
                }
              });
            }
          } catch(e) {}
          
          // Load each other folder
          for (const f of folders) {
            if (f === 'General' || f === 'Old Photos') continue;
            try {
              const resF = await fetch('/api/gallery?folder=' + encodeURIComponent(f));
              const jsonF = await resF.json();
              if (jsonF.photos) {
                jsonF.photos.forEach(p => {
                  if (!seen.has(p.url)) {
                    seen.add(p.url);
                    allPhotos.push(p);
                  }
                });
              }
            } catch(e) {}
          }
          
          if (allPhotos.length > 0) {
            allPhotos.forEach(photo => {
              const tile = document.createElement('div');
              tile.className = 'tile';
              tile.style.cursor = 'pointer';
              const img = document.createElement('img');
              img.src = photo.url;
              img.alt = 'Gallery photo';
              tile.appendChild(img);
              tile.dataset.uploadedBy = photo.uploadedBy || 'Unknown';
              grid.appendChild(tile);
            });
            return;
          }
        }
        
        let param = folder;
        if (folder === 'Old Photos') param = 'root';
        const res = await fetch('/api/gallery?folder=' + encodeURIComponent(param));
        const json = await res.json();
        if (json.photos && json.photos.length > 0) {
          json.photos.forEach(photo => {
            const tile = document.createElement('div');
            tile.className = 'tile';
            tile.style.cursor = 'pointer';
            const img = document.createElement('img');
            img.src = photo.url;
            img.alt = 'Gallery photo';
            tile.appendChild(img);
            if (photo.uploadedBy) {
              tile.dataset.uploadedBy = photo.uploadedBy;
            } else {
              tile.dataset.uploadedBy = 'Unknown';
            }
            grid.appendChild(tile);
          });
        } else if (folder === 'Old Photos') {
          // Try fetching root directly
          const res2 = await fetch('/api/gallery?folder=');
          const json2 = await res2.json();
          if (json2.photos && json2.photos.length > 0) {
            json2.photos.forEach(photo => {
              const tile = document.createElement('div');
              tile.className = 'tile';
              tile.style.cursor = 'pointer';
              const img = document.createElement('img');
              img.src = photo.url;
              img.alt = 'Gallery photo';
              tile.appendChild(img);
              tile.dataset.uploadedBy = photo.uploadedBy || 'Unknown';
              grid.appendChild(tile);
            });
          } else {
            const empty = document.createElement('div');
            empty.style.color = '#fff';
            empty.style.textShadow = '0 1px 6px #428ec080';
            empty.textContent = 'No photos yet';
            grid.appendChild(empty);
          }
        } else {
          const empty = document.createElement('div');
          empty.style.color = '#fff';
          empty.style.textShadow = '0 1px 6px #428ec080';
          empty.textContent = 'No photos yet';
          grid.appendChild(empty);
        }
      } catch (e) {}
    }

    async function loadFolders() {
      try {
        const res = await fetch('/api/gallery');
        const json = await res.json();
        folders = json.folders || [];
        if (folders.length === 0) folders = ['General'];
        // Ensure General is present
        if (!folders.includes('General')) folders.push('General');
        renderFolders();
      } catch (e) {
        folders = ['General'];
        renderFolders();
      }
    }

    createFolderBtn.addEventListener('click', () => {
      const name = newFolderInput.value.trim();
      if (!name) return;
      if (!folders.includes(name)) {
        folders.push(name);
        newFolderInput.value = '';
        renderFolders();
      } else {
        // Still allow re-rendering in case
        renderFolders();
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const file = input.files?.[0];
      if (!file) return;
      const user = localStorage.getItem('charlotte-user') || 'Unknown';
      const selectedFolders = Array.from(folderCheckboxes.querySelectorAll('input:checked')).map(cb => cb.value);
      if (selectedFolders.length === 0) {
        statusEl.textContent = 'Select at least one folder';
        return;
      }
      btn.disabled = true;
      statusEl.textContent = 'Uploading...';

      try {
        for (const folder of selectedFolders) {
          // Add folder to list if not present
          if (!folders.includes(folder)) {
            folders.push(folder);
            renderFolders();
          }
          const data = new FormData();
          data.append('photo', file);
          data.append('uploadedBy', user);
          data.append('folder', folder);
          const res = await fetch('/api/upload', {
            method: 'POST',
            body: data
          });
          const json = await res.json();
          if (!res.ok) throw new Error(json.error || 'Upload failed');
        }
        statusEl.textContent = 'Uploaded to all selected folders!';
        form.reset();
        renderGalleryView();
      } catch (err) {
        statusEl.textContent = err.message;
      } finally {
        btn.disabled = false;
      }
    });

    // Lightbox
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxPfp = document.getElementById('lightboxPfp');
    const lightboxName = document.getElementById('lightboxName');
    const lightboxClose = document.getElementById('lightboxClose');
    
    async function openLightbox(src, by) {
      if (!lightbox) return;
      lightboxImg.src = src;
      lightboxName.textContent = by || 'Unknown';
      lightboxPfp.src = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(by || 'U') + '&background=e8f6ff&color=2873a6&size=128';
      if (by) {
        try {
          const res = await fetch('/api/profile?user=' + encodeURIComponent(by));
          const json = await res.json();
          if (json.url) lightboxPfp.src = json.url;
        } catch (e) {}
      }
      lightbox.classList.add('active');
    }
    
    if (lightboxClose) {
      lightboxClose.addEventListener('click', () => lightbox.classList.remove('active'));
    }
    if (lightbox) {
      lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) lightbox.classList.remove('active');
      });
    }
    
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && lightbox) lightbox.classList.remove('active');
    });
    
    document.addEventListener('click', (e) => {
      if (e.target.tagName === 'IMG' && e.target.closest('.tile')) {
        const tile = e.target.closest('.tile');
        const by = tile.dataset.uploadedBy || 'Unknown';
        openLightbox(e.target.src, by);
      }
    });

    loadFolders();
  </script>
  <script src="avatar.js"></script>
</body>
</html>
