<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery</title>
  <script>
    if (!localStorage.getItem('charlotte-user')) {
      window.location.href = 'login.html';
    }
  </script>
  <style>
    :root { --sky: #a4deff; --deep-blue: #245b85; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", Arial, sans-serif;
      background: linear-gradient(145deg, #c8edff, var(--sky) 55%, #8ccfff);
      color: var(--deep-blue);
    }
    .screen {
      width: min(1100px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 80px 18px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
    }
    h1 { margin: 0; color: #fff; font-size: clamp(2rem, 6vw, 3.6rem); text-shadow: 0 3px 14px #428ec080; }
    .subtitle { margin: 0; color: #fff; font-size: clamp(1rem, 3vw, 1.2rem); text-shadow: 0 2px 8px #428ec080; }
    .upload-card {
      width: min(720px, 92vw);
      background: #ffffffee;
      border-radius: 18px;
      box-shadow: 0 12px 30px #347eac30;
      padding: clamp(16px, 4vw, 24px);
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    .upload-card form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      width: 100%;
    }
    .upload-card input[type="file"] {
      font-family: inherit;
    }
    .grid {
      width: min(1100px, 94vw);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      align-items: start;
    }
    .tile {
      border-radius: 16px;
      overflow: hidden;
      background: linear-gradient(145deg, #f0faff, #e6f6ff);
      box-shadow: 0 12px 30px #347eac30;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 220px;
    }
    .tile img {
      width: 100%;
      height: auto;
      max-height: 70vh;
      object-fit: contain;
      display: block;
    }
    .tile.empty {
      color: #3b7db3;
      text-align: center;
      padding: 16px;
    }
    .button {
      border: 0;
      border-radius: 999px;
      padding: 12px 22px;
      background: white;
      color: #2873a6;
      font-size: 0.98rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 7px 20px #347eac35;
      cursor: pointer;
    }
    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .top-bar { position: fixed; top: 16px; left: 16px; z-index: 5; }
    .status {
      color: #2873a6;
      font-size: 0.95rem;
      min-height: 1.2rem;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <a class="button" href="index.html">← Back to hub</a>
  </div>
  <main class="screen">
    <h1>Gallery</h1>
    <p class="subtitle">Photos together</p>
    <section class="upload-card">
      <strong>Upload a photo</strong>
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:center;">
        <select id="folderSelect" style="padding:10px 14px; border-radius:10px; border:1px solid #b9dcf5;"></select>
        <input id="newFolderInput" placeholder="New folder name" style="padding:10px 14px; border-radius:10px; border:1px solid #b9dcf5;">
        <button class="button" id="createFolderBtn" type="button">Create Folder</button>
      </div>
      <form id="uploadForm">
        <input id="photoInput" type="file" name="photo" accept="image/*" required>
        <button class="button" id="uploadBtn" type="submit">Upload to selected folder</button>
      </form>
      <div class="status" id="uploadStatus"></div>
    </section>
    <div id="folderView" style="display:flex; flex-direction:column; gap:16px; width:100%; align-items:center;"></div>
  </main>
  <script>
    const form = document.getElementById('uploadForm');
    const input = document.getElementById('photoInput');
    const btn = document.getElementById('uploadBtn');
    const statusEl = document.getElementById('uploadStatus');
    const folderSelect = document.getElementById('folderSelect');
    const newFolderInput = document.getElementById('newFolderInput');
    const createFolderBtn = document.getElementById('createFolderBtn');
    const folderView = document.getElementById('folderView');

    let folders = [];

    function renderFolders() {
      folderSelect.innerHTML = '';
      const allOption = document.createElement('option');
      allOption.value = 'all';
      allOption.textContent = 'All Photos';
      folderSelect.appendChild(allOption);
      folders.forEach(f => {
        const opt = document.createElement('option');
        opt.value = f;
        opt.textContent = f;
        folderSelect.appendChild(opt);
      });
      renderGalleryView();
    }

    function renderGalleryView() {
      folderView.innerHTML = '';
      const selected = folderSelect.value;
      if (selected === 'all') {
        folders.forEach(folder => {
          const section = document.createElement('section');
          section.style.width = 'min(1100px, 94vw)';
          section.innerHTML = `<h2 style="color:#fff; text-shadow:0 2px 8px #428ec080; text-align:left;">${folder}</h2>`;
          const grid = document.createElement('div');
          grid.className = 'grid';
          grid.dataset.folder = folder;
          section.appendChild(grid);
          folderView.appendChild(section);
          loadFolderPhotos(folder, grid);
        });
      } else {
        const section = document.createElement('section');
        section.style.width = 'min(1100px, 94vw)';
        section.innerHTML = `<h2 style="color:#fff; text-shadow:0 2px 8px #428ec080; text-align:left;">${selected}</h2>`;
        const grid = document.createElement('div');
        grid.className = 'grid';
        grid.dataset.folder = selected;
        section.appendChild(grid);
        folderView.appendChild(section);
        loadFolderPhotos(selected, grid);
      }
    }

    async function loadFolderPhotos(folder, grid) {
      try {
        const res = await fetch('/api/gallery?folder=' + encodeURIComponent(folder));
        const json = await res.json();
        if (json.photos && json.photos.length > 0) {
          json.photos.forEach(photo => {
            const tile = document.createElement('div');
            tile.className = 'tile';
            tile.style.flexDirection = 'column';
            const img = document.createElement('img');
            img.src = photo.url;
            img.alt = 'Gallery photo';
            tile.appendChild(img);
            if (photo.uploadedBy) {
              const byline = document.createElement('div');
              byline.style.padding = '6px 10px';
              byline.style.fontSize = '0.85rem';
              byline.style.color = '#2873a6';
              byline.textContent = `Uploaded by ${photo.uploadedBy}`;
              tile.appendChild(byline);
            }
            grid.appendChild(tile);
          });
        } else {
          const empty = document.createElement('div');
          empty.style.color = '#fff';
          empty.style.textShadow = '0 1px 6px #428ec080';
          empty.textContent = 'No photos yet';
          grid.appendChild(empty);
        }
      } catch (e) {}
    }

    async function loadFolders() {
      try {
        const res = await fetch('/api/gallery');
        const json = await res.json();
        folders = json.folders || [];
        if (folders.length === 0) folders = ['General'];
        renderFolders();
      } catch (e) {
        folders = ['General'];
        renderFolders();
      }
    }

    createFolderBtn.addEventListener('click', () => {
      const name = newFolderInput.value.trim();
      if (!name) return;
      if (!folders.includes(name)) {
        folders.push(name);
        newFolderInput.value = '';
        renderFolders();
        folderSelect.value = name;
        renderGalleryView();
      }
    });

    folderSelect.addEventListener('change', renderGalleryView);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const file = input.files?.[0];
      if (!file) return;
      const user = localStorage.getItem('charlotte-user') || 'Unknown';
      const folder = folderSelect.value === 'all' ? 'General' : folderSelect.value;
      btn.disabled = true;
      statusEl.textContent = 'Uploading...';

      try {
        const data = new FormData();
        data.append('photo', file);
        data.append('uploadedBy', user);
        data.append('folder', folder);
        const res = await fetch('/api/upload', {
          method: 'POST',
          body: data
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Upload failed');
        statusEl.textContent = 'Uploaded!';
        form.reset();
        renderGalleryView();
      } catch (err) {
        statusEl.textContent = err.message;
      } finally {
        btn.disabled = false;
      }
    });

    loadFolders();
  </script>
</body>
</html>
