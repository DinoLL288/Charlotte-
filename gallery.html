<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery</title>
  <style>
    :root { --sky: #a4deff; --deep-blue: #245b85; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", Arial, sans-serif;
      background: linear-gradient(145deg, #c8edff, var(--sky) 55%, #8ccfff);
      color: var(--deep-blue);
      display: grid;
      place-items: center;
    }
    .screen {
      width: min(1100px, 100%);
      min-height: 100vh;
      padding: 28px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 14px;
    }
    h1 { margin: 0; color: #fff; font-size: clamp(2rem, 6vw, 3.6rem); text-shadow: 0 3px 14px #428ec080; }
    .subtitle { margin: 0; color: #fff; font-size: clamp(1rem, 3vw, 1.2rem); text-shadow: 0 2px 8px #428ec080; }
    .grid {
      width: min(1100px, 94vw);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
    }
    .tile {
      border-radius: 16px;
      overflow: hidden;
      background: #ffffffd9;
      box-shadow: 0 12px 30px #347eac30;
      min-height: 220px;
      display: grid;
      place-items: center;
      color: #3b7db3;
      text-align: center;
      padding: 16px;
    }
    .button {
      border: 0;
      border-radius: 999px;
      padding: 12px 22px;
      background: white;
      color: #2873a6;
      font-size: 0.98rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 7px 20px #347eac35;
    }
    .top-bar { position: absolute; top: 16px; left: 16px; }
  </style>
</head>
<body>
  <div class="top-bar">
    <a class="button" href="index.html">← Back to hub</a>
  </div>
  <main class="screen">
    <h1>Gallery</h1>
    <p class="subtitle">Photos together</p>
    <div class="grid">
      <div class="tile">
        <div>
          <strong>Add photos here</strong>
          <p>Drop images in this folder and link them</p>
        </div>
      </div>
      <div class="tile"></div>
      <div class="tile"></div>
    </div>
  </main>
</body>
</html>
