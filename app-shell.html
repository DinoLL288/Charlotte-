<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Charlotte &amp; Luke</title>
  <link rel="manifest" href="/site.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0d2c44">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Charlotte">
<link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <script>
    // Preview-only login bypass (same gate as assets/js/site-shell-guard.js):
    // on Cloudflare Pages preview hostnames other than the live
    // charlotte-3ts.pages.dev, sign in locally as Luke so the preview can be
    // reviewed without login secrets. Live site behaviour is unchanged.
    (function () { try { var h = location.hostname || ''; if (h !== 'charlotte-3ts.pages.dev' && h.endsWith('.pages.dev') && !localStorage.getItem('charlotte-user')) localStorage.setItem('charlotte-user', 'Luke'); } catch (e) {} })();
    if (!localStorage.getItem('charlotte-user')) location.replace('login.html');
  </script>
  <link rel="stylesheet" href="assets/css/theme.css"><link rel="stylesheet" href="assets/css/site-polish.css"><link rel="stylesheet" href="assets/css/site-theme.css"><link rel="stylesheet" href="assets/css/motion.css"><link rel="stylesheet" href="assets/css/install-prompt.css">
  <script>
    // Register the service worker from the top-level shell. (The guard
    // inside framed pages deliberately skips registration — a worker
    // registered from an iframe would be scoped to that frame, not the app.)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.getRegistrations().then(function (rs) {
          return Promise.all(rs.map(function (r) { return r.unregister(); }));
        }).catch(function () {});
        navigator.serviceWorker.register('/sw.js?v=19').catch(function () {});
      });
    }
  </script>
  <style>
    html,body{width:100%;height:100%;min-height:100%;margin:0;overflow:hidden;background:#f3f6f8}
    #siteFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:transparent;opacity:0;transform:translateY(10px);filter:blur(5px);transition:opacity .45s cubic-bezier(.22,1,.36,1),transform .45s cubic-bezier(.22,1,.36,1),filter .45s cubic-bezier(.22,1,.36,1)}
    #siteFrame.is-visible{opacity:1;transform:none;filter:none}
    body.is-navigating #siteFrame{opacity:0;transform:scale(.99);filter:blur(3px);transition-duration:.18s}
    /* A thin line sweeps across the top only if a page takes more than a moment to arrive. */
    #navProgress{position:fixed;top:0;left:0;z-index:50;width:38%;height:2px;background:var(--accent,#2c6e92);opacity:0;pointer-events:none}
    body.is-navigating #navProgress{opacity:.85;animation:progress-sweep 1.1s ease-in-out .3s infinite}
    @media(prefers-reduced-motion:reduce){#siteFrame,body.is-navigating #siteFrame{transition:none;filter:none;transform:none}#navProgress{display:none}}
  </style>
</head>
<body>
  <div id="navProgress" aria-hidden="true"></div>
  <iframe id="siteFrame" title="Charlotte and Luke website" allow="autoplay; encrypted-media; clipboard-write; fullscreen; picture-in-picture"></iframe>
  <script src="assets/js/site-theme.js"></script><script src="assets/js/site-shell.js?v=11"></script><script src="assets/js/presence.js"></script>
<script src="assets/js/install-prompt.js?v=2"></script>
</body>
</html>
