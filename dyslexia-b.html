<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout B · Big buttons, big text</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    body{margin:0;min-height:100vh;font-family:var(--font-body);background:linear-gradient(160deg,#c8edff,#a9dcf7 55%,#8ccfff);color:#10344f}
    .preview-banner{position:sticky;top:0;z-index:50;padding:10px 16px;text-align:center;background:#143f5f;color:#fff;font-size:.85rem;font-weight:700}
    .preview-banner a{color:#ecd7a0;margin-left:12px}
    .hero{padding:50px 20px 20px;text-align:center;color:#fff;background:linear-gradient(160deg,rgba(13,44,68,.85),rgba(42,120,168,.85))}
    .hero h1{margin:8px 0 4px;font-family:var(--font-display);font-size:clamp(2rem,6vw,2.8rem);font-weight:400}
    .hero p{margin:0 auto;max-width:40ch;color:#eaf6ff;line-height:1.6;font-size:1.05rem}
    .grid{width:min(560px,calc(100% - 32px));margin:30px auto 60px;display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
    .big-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px 12px;border-radius:20px;background:rgba(255,255,255,.9);border:2px solid #fff;box-shadow:0 8px 24px rgba(29,90,128,.12);text-decoration:none;color:#123a58;transition:transform .15s,box-shadow .15s;min-height:110px}
    .big-btn:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(29,90,128,.18)}
    .big-btn .icon{font-size:2.4rem}
    .big-btn .title{font-family:var(--font-display);font-size:1.15rem;font-weight:700}
    @media(max-width:400px){.grid{grid-template-columns:1fr}.big-btn{min-height:80px}}
  </style>
</head>
<body>
  <div class="preview-banner">Layout B · Big buttons, big text — icon + title only, 2 columns. <a href="dyslexia-layouts.html">Back to chooser</a></div>
  <header class="hero">
    <h1>Our little universe</h1>
    <p>Tap a button to go there.</p>
  </header>
  <div class="grid">
    <a class="big-btn" href="love.html"><span class="icon">🤍</span><span class="title">Our love</span></a>
    <a class="big-btn" href="messages.html"><span class="icon">✉️</span><span class="title">Notes</span></a>
    <a class="big-btn" href="gallery.html"><span class="icon">📷</span><span class="title">Photos</span></a>
    <a class="big-btn" href="calendar.html"><span class="icon">📅</span><span class="title">Calendar</span></a>
    <a class="big-btn" href="play.html"><span class="icon">🎲</span><span class="title">Play</span></a>
    <a class="big-btn" href="games.html"><span class="icon">🪙</span><span class="title">Games</span></a>
    <a class="big-btn" href="more-games.html"><span class="icon">🎮</span><span class="title">More games</span></a>
    <a class="big-btn" href="journal.html"><span class="icon">📖</span><span class="title">Journal</span></a>
    <a class="big-btn" href="mood.html"><span class="icon">💛</span><span class="title">Mood</span></a>
    <a class="big-btn" href="stats.html"><span class="icon">📊</span><span class="title">Stats</span></a>
    <a class="big-btn" href="achievements.html"><span class="icon">🏆</span><span class="title">Badges</span></a>
    <a class="big-btn" href="secrets.html"><span class="icon">🗝️</span><span class="title">Secrets</span></a>
  </div>
</body>
</html>
