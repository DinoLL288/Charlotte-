<!DOCTYPE html>
<html lang="en">
<head>
  <script src="assets/js/site-shell-guard.js"></script>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>Wishlist · Things we want</title>
  <link rel="manifest" href="/site.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0d2c44">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Charlotte">
  <script>if(!localStorage.getItem('charlotte-user'))location.href='login.html';</script>
  <link rel="stylesheet" href="assets/css/site-bundle.css" data-site-polish="true" data-site-theme="true">
  <style>
    body{margin:0;min-height:100vh;font-family:var(--font-body);background:linear-gradient(160deg,#edf8ff,#badff5 100%);color:#123a58}.hero{padding:78px 20px 48px;text-align:center;color:#fff;background:linear-gradient(160deg,#0d2c44,#2a78a8)}.hero h1{margin:8px 0;font-size:clamp(2.2rem,8vw,3.5rem)}.hero p{margin:0 auto;max-width:48ch;opacity:.9}.shell{width:min(980px,calc(100% - 32px));margin:-28px auto 70px}.panel{padding:18px;border-radius:20px;background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.95);box-shadow:0 10px 30px rgba(29,90,128,.12);margin-bottom:14px}.panel h2,.panel h3{font-family:var(--font-display);margin:0 0 12px}.top-bar{position:absolute}.button{padding:10px 16px;border-radius:999px;background:#123a58;color:#fff;text-decoration:none;font-weight:700;font-size:.9rem;border:0;cursor:pointer}.button.secondary{background:#edf4f8;color:#123a58}.button.danger{background:#fbe9e7;color:#8a3b2e}.button.small{padding:7px 12px;font-size:.8rem}.button:disabled{opacity:.55;cursor:default}.status{min-height:1.4em;margin:8px 0 0;color:#73591f;font-weight:700}.count{font-size:1.05rem;font-weight:700;margin:0 0 4px}.count-note{font-size:.8rem;color:#6a8292;margin:0}.add-form{display:grid;gap:8px}.add-row{display:flex;gap:8px;flex-wrap:wrap}.add-row input{flex:1 1 220px;min-width:0;border:1px solid #d5e3ec;border-radius:999px;padding:11px 14px;font:inherit;box-sizing:border-box}.add-row input.short{flex:0 1 140px}.wish-list{display:grid;gap:8px}.wish-item{display:flex;gap:10px;align-items:center;background:#eff5f8;border-radius:14px;padding:9px 10px;border:1px solid transparent}.wish-item.bought{opacity:.7}.wish-item.bought .wish-info strong{text-decoration:line-through}.wish-info{flex:1;min-width:0}.wish-info strong{display:block;font-size:.95rem}.wish-info strong a{color:#123a58}.wish-info span{display:block;font-size:.78rem;color:#6a8292}.wish-info span.wish-bought-meta{color:#73591f;font-weight:700}.wish-actions{display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}@media(max-width:720px){.shell{width:calc(100% - 20px)}.wish-item{flex-wrap:wrap}.wish-actions{width:100%}}
  </style>
</head>
<body>
  <div class="top-bar"><a class="button secondary" href="index.html">← Back to hub</a></div>
  <header class="hero"><p style="text-transform:uppercase;letter-spacing:.12em;font-size:.8rem">Wishlist</p><h1>🎁 Things we want</h1><p>Things we want, or want to buy each other. Add one, and tick it off when one of us gets it.</p></header>
  <main class="shell">
    <section class="panel">
      <p class="count" id="wishCount">Loading our wishlist…</p>
      <p class="count-note"><span id="wishingAs"></span> Bought things sit at the bottom, struck through.</p>
    </section>

    <section class="panel">
      <h2>Add something</h2>
      <div class="add-form">
        <div class="add-row">
          <input id="wishNameInput" type="text" placeholder="What do you want?" aria-label="Item name" maxlength="120">
        </div>
        <div class="add-row">
          <input id="wishLinkInput" type="url" placeholder="Link to it (optional)" aria-label="Link (optional)" inputmode="url">
          <input id="wishPriceInput" class="short" type="text" placeholder="Price (optional)" aria-label="Price (optional)" inputmode="decimal">
          <button class="button" id="wishAddButton" type="button">Add to wishlist</button>
        </div>
      </div>
      <p class="status" id="wishAddStatus" role="status"></p>
    </section>

    <section class="panel">
      <h2>Still wishing</h2>
      <div class="wish-list" id="wishOpen"><span style="color:#6a8292;font-size:.9rem">Loading our wishlist…</span></div>
    </section>

    <section class="panel" id="wishBoughtSection" style="display:none">
      <h2>Bought ✓</h2>
      <div class="wish-list" id="wishBought"></div>
    </section>
  </main>
  <script src="assets/js/dialog.js"></script><script src="assets/js/avatar.js"></script>
  <script type="module" src="assets/js/wishlist.js?v=1"></script>
  <script src="assets/js/stickers-overlay.js"></script>
</body>
</html>
