<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages</title>
  <style>
    :root { --sky: #a4deff; --deep-blue: #245b85; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", Arial, sans-serif;
      background: linear-gradient(145deg, #c8edff, var(--sky) 55%, #8ccfff);
      color: var(--deep-blue);
      display: grid;
      place-items: center;
    }
    .screen {
      width: min(900px, 100%);
      min-height: 100vh;
      padding: 28px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 14px;
    }
    h1 { margin: 0; color: #fff; font-size: clamp(2rem, 6vw, 3.6rem); text-shadow: 0 3px 14px #428ec080; }
    .subtitle { margin: 0; color: #fff; font-size: clamp(1rem, 3vw, 1.2rem); text-shadow: 0 2px 8px #428ec080; }
    .card {
      width: min(720px, 92vw);
      background: #ffffffee;
      border-radius: 18px;
      box-shadow: 0 12px 30px #347eac30;
      padding: clamp(18px, 4vw, 28px);
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card p { margin: 0; font-size: clamp(1rem, 2.6vw, 1.08rem); line-height: 1.7; }
    .button {
      border: 0;
      border-radius: 999px;
      padding: 12px 22px;
      background: white;
      color: #2873a6;
      font-size: 0.98rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 7px 20px #347eac35;
    }
    .top-bar { position: absolute; top: 16px; left: 16px; }
  </style>
</head>
<body>
  <div class="top-bar">
    <a class="button" href="index.html">← Back to hub</a>
  </div>
  <main class="screen">
    <h1>Messages</h1>
    <p class="subtitle">Little notes for you</p>
    <div class="card">
      <p>More messages coming soon. Add your own notes here whenever you want!</p>
    </div>
  </main>
</body>
</html>
