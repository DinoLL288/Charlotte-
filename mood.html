<!DOCTYPE html>
<html lang="en">
<head>
  <script src="assets/js/site-shell-guard.js"></script>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>Mood · How are we feeling?</title>
  <link rel="manifest" href="/site.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0d2c44">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Charlotte">
  <script>if(!localStorage.getItem('charlotte-user'))location.href='login.html';</script>
  <link rel="stylesheet" href="assets/css/site-bundle.css" data-site-polish="true" data-site-theme="true">
  <style>
    body{margin:0;min-height:100vh;font-family:var(--font-body);background:linear-gradient(160deg,#edf8ff,#badff5 100%);color:#123a58}.hero{padding:78px 20px 48px;text-align:center;color:#fff;background:linear-gradient(160deg,#0d2c44,#2a78a8)}.hero h1{margin:8px 0;font-size:clamp(2.2rem,8vw,3.5rem)}.hero p{margin:0 auto;max-width:48ch;opacity:.9}.shell{width:min(980px,calc(100% - 32px));margin:-28px auto 70px}.panel{padding:18px;border-radius:20px;background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.95);box-shadow:0 10px 30px rgba(29,90,128,.12);margin-bottom:14px}.panel h2,.panel h3{font-family:var(--font-display);margin:0 0 12px}.top-bar{position:absolute}.button{padding:10px 16px;border-radius:999px;background:#123a58;color:#fff;text-decoration:none;font-weight:700;font-size:.9rem;border:0;cursor:pointer}.button.secondary{background:#edf4f8;color:#123a58}.mood-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.mood-btn{min-height:68px;border:1px solid #d5e3ec;border-radius:16px;background:#fff;font-size:1.55rem;cursor:pointer;display:grid;place-items:center;gap:2px;transition:.15s}.mood-btn small{font-size:.68rem;color:#6a8292}.mood-btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(52,127,163,.12)}.mood-btn.selected{background:#fff4d8;border-color:#c9a24a;box-shadow:0 0 0 2px #c9a24a55}.intensity{display:flex;align-items:center;gap:10px;margin:14px 0}.intensity input{flex:1}.note{width:100%;min-height:72px;resize:vertical;border:1px solid #d5e3ec;border-radius:12px;padding:11px;font:inherit;box-sizing:border-box}.status{min-height:1.4em;margin:8px 0 0;color:#73591f;font-weight:700}.calendar-top{display:flex;justify-content:space-between;align-items:center}.calendar-nav{display:flex;gap:6px}.calendar-nav .button{padding:8px 12px}.days-header,.mood-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.days-header{text-align:center;font-size:.68rem;font-weight:800;color:#7b91a0;text-transform:uppercase;margin-bottom:5px}.mood-day{min-height:78px;border-radius:12px;background:#eff5f8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;border:1px solid transparent}.mood-day.empty{background:transparent;cursor:default}.mood-day.today{border-color:#c9a24a}.day-number{font-size:.7rem;color:#7891a1}.day-mood{font-size:1.25rem}.day-by{font-size:.62rem;color:#7891a1;text-align:center}.day-mood-text{font-size:.68rem}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{border-radius:14px;background:#edf6fb;padding:12px;text-align:center}.stat strong{display:block;font-size:1.25rem;color:#123a58}.stat span{font-size:.72rem;color:#6a8292}.trend{display:grid;gap:7px}.trend-row{display:grid;grid-template-columns:90px 1fr 28px;align-items:center;gap:8px;font-size:.78rem}.trend-bar{height:8px;border-radius:999px;background:#dfedf5;overflow:hidden}.trend-bar i{display:block;height:100%;border-radius:999px;background:#73add2}.partner-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.partner-card{border-radius:14px;background:#eff7fb;padding:12px}.partner-card strong{display:block;margin-bottom:5px}.partner-card span{font-size:.85rem;color:#5c7c93}.two-col{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}@media(max-width:720px){.mood-grid{grid-template-columns:repeat(4,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.two-col,.partner-grid{grid-template-columns:1fr}.mood-day{min-height:62px}.shell{width:calc(100% - 20px)}}
  </style>
</head>
<body>
  <div class="top-bar"><a class="button secondary" href="index.html">← Back to hub</a></div>
  <header class="hero"><p style="text-transform:uppercase;letter-spacing:.12em;font-size:.8rem">How are we feeling?</p><h1>Mood tracker</h1><p>A calmer way to notice how we are, without trying to fix anything straight away.</p></header>
  <main class="shell">
    <section class="panel">
      <h2 id="logTitle">How are you feeling today?</h2>
      <div class="mood-grid" id="moodChoices">
        <button class="mood-btn" data-mood="🥰"><span>🥰</span><small>Loved</small></button><button class="mood-btn" data-mood="😊"><span>😊</span><small>Happy</small></button><button class="mood-btn" data-mood="💛"><span>💛</span><small>Calm</small></button><button class="mood-btn" data-mood="🌙"><span>🌙</span><small>Tired</small></button><button class="mood-btn" data-mood="🤔"><span>🤔</span><small>Unsure</small></button><button class="mood-btn" data-mood="😤"><span>😤</span><small>Stressed</small></button><button class="mood-btn" data-mood="😔"><span>😔</span><small>Low</small></button><button class="mood-btn" data-mood="😢"><span>😢</span><small>Sad</small></button><button class="mood-btn" data-mood="😰"><span>😰</span><small>Anxious</small></button><button class="mood-btn" data-mood="😠"><span>😠</span><small>Angry</small></button><button class="mood-btn" data-mood="😞"><span>😞</span><small>Depressed</small></button><button class="mood-btn" data-mood="😶"><span>😶</span><small>Numb</small></button><button class="mood-btn" data-mood="😭"><span>😭</span><small>Overwhelmed</small></button>
      </div>
      <div class="intensity"><strong>Intensity</strong><input id="intensity" type="range" min="1" max="5" value="3" aria-label="Mood intensity"><strong id="intensityValue">3</strong></div>
      <textarea class="note" id="moodNote" maxlength="300" placeholder="Optional note: what is behind this mood?"></textarea>
      <div id="moodEntries" style="margin-top:10px;display:grid;gap:6px;"></div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:10px"><button class="button" id="saveMood" type="button">Save today</button><span class="status" id="moodStatus" role="status"></span></div>
    </section>

    <div class="two-col">
      <section class="panel">
        <div class="calendar-top"><h2 id="calMonth">Mood calendar</h2><div class="calendar-nav"><button class="button secondary" id="prevMonth" type="button">←</button><button class="button secondary" id="nextMonth" type="button">→</button></div></div>
        <div class="days-header"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
        <div class="mood-cal" id="moodCal"></div>
      </section>
      <aside>
        <section class="panel"><h3>This month</h3><div class="stats" id="stats"></div></section>
        <section class="panel"><h3>Partner check-in</h3><div class="partner-grid" id="partnerCheck"></div></section>
      </aside>
    </div>

    <section class="panel"><h3>30-day trend</h3><div class="trend" id="trend"></div></section>
  </main>
  <script src="assets/js/dialog.js"></script><script src="assets/js/avatar.js"></script>
  <script>
  (function(){
    const user=localStorage.getItem('charlotte-user')||'Unknown';
    const today=new Date();let current=new Date(today.getFullYear(),today.getMonth(),1);let entries={};let selectedMood='';let selectedDate=todayKey();
    const moodChoices=document.getElementById('moodChoices'),cal=document.getElementById('moodCal'),monthLabel=document.getElementById('calMonth'),status=document.getElementById('moodStatus'),note=document.getElementById('moodNote'),intensity=document.getElementById('intensity');
    const emojiLabels={'🥰':'Loved','😊':'Happy','💛':'Calm','🌙':'Tired','🤔':'Unsure','😤':'Stressed','😔':'Low','😢':'Sad','😰':'Anxious','😠':'Angry','😞':'Depressed','😶':'Numb','😭':'Overwhelmed'};
    function pad(n){return String(n).padStart(2,'0')}function key(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}function todayKey(){return key(today)}
    function normalizeEntries(raw,user){
      if(!raw||typeof raw!=='object')return{};
      // New format: per-user keys
      if(raw.Charlotte||raw.Luke){return raw;}
      // Old format: flat date->mood (treat as current user's)
      const out={};out[user]={};Object.keys(raw).forEach(d=>{out[user][d]=raw[d];});return out;
    }
    function normalizeEntry(value){if(!value)return null;if(typeof value==='string')return{mood:value,intensity:3,note:'',time:''};return{mood:value.mood||'',intensity:Number(value.intensity)||3,note:String(value.note||''),time:value.time||'',id:value.id||''};}
    function normalizeEntries(raw,user){
      if(!raw||typeof raw!=='object')return{};
      if(raw.Charlotte||raw.Luke){const out={};['Charlotte','Luke'].forEach(u=>{const src=raw[u]||{};out[u]={};Object.keys(src).forEach(d=>{const v=src[d];out[u][d]=Array.isArray(v)?v.map(normalizeEntry).filter(Boolean):(v? [normalizeEntry(v)].filter(Boolean):[]);});});return out;}
      const out={};out[user]={};Object.keys(raw).forEach(d=>{const v=raw[d];out[user][d]=Array.isArray(v)?v.map(normalizeEntry).filter(Boolean):(v?[normalizeEntry(v)].filter(Boolean):[]);});return out;
    }
    async function load(){try{const r=await fetch('/api/question-room?view=mood&user='+encodeURIComponent(user),{cache:'no-store'}),j=await r.json();entries=normalizeEntries(j.entries||j.moods||{},user);}catch{}render();const m=myEntries();if(m.length)setSelected(m[m.length-1]);}
    function personEntries(person){const source=entries[person]||{};const out={};Object.keys(source).forEach(d=>{const arr=(source[d]||[]).map(normalizeEntry).filter(v=>v&&v.mood);if(arr.length)out[d]=arr;});return out;}
    function myEntries(date=todayKey()){const src=entries[user]&&entries[user][date];return Array.isArray(src)?src.map(normalizeEntry).filter(v=>v&&v.mood):[];}
    async function save(){if(!selectedMood){status.textContent='Choose a mood first.';return;}const button=document.getElementById('saveMood');button.disabled=true;status.textContent='Saving…';try{const r=await fetch('/api/question-room',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'mood',user,date:selectedDate,mood:selectedMood,intensity:Number(intensity.value),note:note.value.trim()})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Could not save mood');entries=normalizeEntries(j.entries||j.moods||entries,user);status.textContent='Mood added.';burstMood(selectedMood);selectedMood='';moodChoices.querySelectorAll('.mood-btn').forEach(b=>b.classList.remove('selected'));note.value='';renderEntries();render();}catch(e){status.textContent=e.message||'Could not save mood';}finally{button.disabled=false;}}
    moodChoices.addEventListener('click',e=>{const button=e.target.closest('.mood-btn');if(!button)return;selectedMood=button.dataset.mood;moodChoices.querySelectorAll('.mood-btn').forEach(b=>b.classList.toggle('selected',b===button));});intensity.addEventListener('input',()=>document.getElementById('intensityValue').textContent=intensity.value);document.getElementById('saveMood').addEventListener('click',save);
    document.getElementById('prevMonth').addEventListener('click',()=>{current=new Date(current.getFullYear(),current.getMonth()-1,1);renderCalendar()});document.getElementById('nextMonth').addEventListener('click',()=>{current=new Date(current.getFullYear(),current.getMonth()+1,1);renderCalendar()});
    function renderCalendar(){monthLabel.textContent=current.toLocaleDateString(undefined,{month:'long',year:'numeric'});cal.replaceChildren();const year=current.getFullYear(),month=current.getMonth(),first=new Date(year,month,1).getDay(),count=new Date(year,month+1,0).getDate();for(let i=0;i<first;i++){const blank=document.createElement('div');blank.className='mood-day empty';cal.appendChild(blank);}const mine=personEntries(user),other=personEntries(user==='Charlotte'?'Luke':'Charlotte');for(let day=1;day<=count;day++){const date=new Date(year,month,day),dateKey=key(date),a=mine[dateKey],b=other[dateKey],cell=document.createElement('div');cell.className='mood-day'+(dateKey===todayKey()?' today':'');const number=document.createElement('span');number.className='day-number';number.textContent=day;cell.appendChild(number);if(a||b){const moods=document.createElement('span');moods.className='day-mood';const mineStr=(a||[]).map(e=>e.mood).join('');const otherStr=(b||[]).map(e=>e.mood).join('');moods.textContent=(mineStr||'·')+(otherStr?' '+otherStr:'');cell.appendChild(moods);const noteTxt=[...(a||[]).map(e=>e.note),...(b||[]).map(e=>e.note)].filter(Boolean).join(' | ');if(noteTxt)cell.title=noteTxt; cell.addEventListener('click',()=>openDay(dateKey)); }cal.appendChild(cell);}}
    function setSelected(entry){if(!entry)return;selectedMood=entry.mood;moodChoices.querySelectorAll('.mood-btn').forEach(b=>b.classList.toggle('selected',b.dataset.mood===entry.mood));intensity.value=entry.intensity||3;document.getElementById('intensityValue').textContent=intensity.value;note.value=entry.note||'';}
    function openDay(dateKey){
      selectedDate=dateKey;
      const mine=personEntries(user);
      const entry=mine[dateKey];
      document.getElementById('logTitle').textContent='Mood for '+new Date(dateKey+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
      if(entry&&entry.length)setSelected(entry[entry.length-1]); else { selectedMood=''; moodChoices.querySelectorAll('.mood-btn').forEach(b=>b.classList.remove('selected')); intensity.value=3; document.getElementById('intensityValue').textContent=3; note.value=''; }
      renderEntries();
      window.scrollTo({top:0,behavior:'smooth'});
    }
    function renderEntries(){
      const box=document.getElementById('moodEntries');
      const arr=myEntries(selectedDate);
      if(!arr.length){box.innerHTML='<span style="color:#6a8292;font-size:.85rem">No moods logged for this day yet.</span>';return;}
      box.innerHTML=arr.map(e=>`<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:#eff5f8;"><span style="font-size:1.3rem">${e.mood}</span><span style="font-size:.8rem;color:#5c7c93">${emojiLabels[e.mood]||''} · intensity ${e.intensity}${e.note?' · '+escapeHtml(e.note):''}</span><button type="button" data-del="${e.id}" style="margin-left:auto;border:0;background:transparent;cursor:pointer;color:#754936;font-weight:700;">✕</button></div>`).join('');
      box.querySelectorAll('[data-del]').forEach(btn=>btn.addEventListener('click',async()=>{if(!confirm('Delete this mood entry?'))return;try{const r=await fetch('/api/question-room',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'mood-delete',user,date:selectedDate,id:btn.dataset.del})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Could not delete');entries=normalizeEntries(j.entries||j.moods||entries,user);renderEntries();render();}catch(e){status.textContent=e.message;}}));
    }
    function escapeHtml(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML;}
    function renderStats(){const mine=personEntries(user);const start=new Date(today);start.setDate(start.getDate()-29);const recent=Object.entries(mine).filter(([date])=>new Date(date+'T12:00:00')>=start).sort(([a],[b])=>a.localeCompare(b));let streak=0;for(let i=0;i<400;i++){const date=new Date(today);date.setDate(today.getDate()-i);if(mine[key(date)]&&mine[key(date)].length)streak++;else if(i===0)continue;else break;}const counts={};recent.forEach(([,arr])=>(arr||[]).forEach(v=>counts[v.mood]=(counts[v.mood]||0)+1));const top=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];const allEntries=recent.flatMap(([,a])=>a||[]);const average=allEntries.length? (allEntries.reduce((sum,v)=>sum+(v.intensity||0),0)/allEntries.length).toFixed(1):'—';document.getElementById('stats').innerHTML=`<div class="stat"><strong>${recent.length}</strong><span>logged this month</span></div><div class="stat"><strong>${streak}</strong><span>day streak</span></div><div class="stat"><strong>${top?top[0]:'—'}</strong><span>most common</span></div><div class="stat"><strong>${average}</strong><span>avg. intensity</span></div>`;}
    function renderPartner(){const otherName=user==='Charlotte'?'Luke':'Charlotte',mine=personEntries(user),other=personEntries(otherName),myToday=myEntries();const latest=Object.entries(other).sort(([a],[b])=>b.localeCompare(a))[0];document.getElementById('partnerCheck').innerHTML=`<div class="partner-card"><strong>You today</strong><span>${myToday.length?myToday[myToday.length-1].mood+' · '+emojiLabels[myToday[myToday.length-1].mood]+' · intensity '+myToday[myToday.length-1].intensity+' ('+myToday.length+')':'Not logged yet'}</span></div><div class="partner-card"><strong>${otherName}</strong><span>${latest&&latest[1]&&latest[1].length?(latest[1][latest[1].length-1].mood+' · '+emojiLabels[latest[1][latest[1].length-1].mood]+' · '+latest[0]+' ('+latest[1].length+')'):'Not logged yet'}</span></div>`;}
    function renderTrend(){const mine=personEntries(user),trend=document.getElementById('trend'),counts={};Object.values(mine).forEach(v=>counts[v.mood]=(counts[v.mood]||0)+1);const values=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,6),max=Math.max(1,...values.map(v=>v[1]));trend.innerHTML=values.length?values.map(([mood,count])=>`<div class="trend-row"><span>${mood} ${emojiLabels[mood]||''}</span><div class="trend-bar"><i style="width:${Math.round(count/max*100)}%"></i></div><strong>${count}</strong></div>`).join(''):'<span style="color:#6a8292">Your 30-day trend will appear after a few check-ins.</span>';}
    function render(){renderCalendar();renderStats();renderPartner();renderTrend();}load();
    // live sync
    (function(){const protocol=location.protocol==='https:'?'wss:':'ws:';let sock=null,timer=null;function open(){sock=new WebSocket(`${protocol}//${location.host}/api/question-room?user=${encodeURIComponent(user)}&sessionDate=2000-01-07`);sock.onopen=()=>{timer=setInterval(()=>{if(sock&&sock.readyState===WebSocket.OPEN)sock.send(JSON.stringify({type:'ping'}));},20000);};sock.onmessage=ev=>{let m;try{m=JSON.parse(ev.data);}catch{return;}if(m.type==='refresh')load();};sock.onclose=()=>{clearInterval(timer);setTimeout(open,3000);};}open();})();
  })();
  </script>
  <style>
    /* Mood-save burst: the chosen mood emoji floats up the screen. */
    .mood-burst-layer{position:fixed;inset:0;z-index:99;overflow:hidden;pointer-events:none}
    .mood-burst{position:absolute;bottom:12%;left:var(--x);font-size:clamp(1.8rem,6vw,3rem);filter:drop-shadow(0 3px 6px rgba(20,63,95,.25));animation:mood-burst-float 2.8s cubic-bezier(.22,1,.36,1) forwards}
    @keyframes mood-burst-float{0%{opacity:0;transform:translate(0,0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translate(var(--drift,10px),-55vh) scale(1.1)}}
    @media(prefers-reduced-motion:reduce){.mood-burst{animation-duration:1ms!important}}
  </style>
  <script>
    function burstMood(emoji){
      if(!emoji) return;
      if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      let layer=document.getElementById('mood-burst-layer');
      if(!layer){layer=document.createElement('div');layer.id='mood-burst-layer';layer.className='mood-burst-layer';layer.setAttribute('aria-hidden','true');document.body.appendChild(layer);}
      for(let i=0;i<9;i++){
        const b=document.createElement('div');b.className='mood-burst';b.textContent=emoji;
        b.style.setProperty('--x',(30+Math.random()*40)+'%');
        b.style.setProperty('--drift',(Math.random()*60-30).toFixed(0)+'px');
        b.style.animationDelay=(i*70)+'ms';
        layer.appendChild(b);setTimeout(()=>b.remove(),3600);
      }
    }
  </script>
<script src="assets/js/stickers-overlay.js"></script>
</body>
</html>
